name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          # Disposable CI-only database; the name must end in _qa (tests refuse anything else). Not a real credential.
          POSTGRES_USER: coparent_user
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: coparent_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coparent_user -d coparent_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://coparent_user:ci_only_not_a_secret@127.0.0.1:5432/coparent_db
      TEST_DATABASE_URL: postgresql://coparent_user:ci_only_not_a_secret@127.0.0.1:5432/coparent_qa
      PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Unit and regression tests
        run: npm test

      - name: Dependency audit (online)
        run: npm audit --audit-level=high

      - name: PostgreSQL 18 client tools (pg_dump/pg_restore must match the server)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Account tests (PostgreSQL)
        run: npm run test:accounts

      - name: Financial integration tests (PostgreSQL)
        run: npm run test:integration

      - name: Backup and restore validation on a migrated, non-empty schema
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
          npm run backup:validate

      - name: Browser tooling
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Full-stack end-to-end tests
        run: npm run test:e2e

      - name: UI audit (contrast, widths incl. 2560, zoom reflow, forced-colors, reduced motion, keyboard)
        run: npm run test:ui

      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            artifacts/*.png
            artifacts/*.pdf
          if-no-files-found: ignore
          retention-days: 7
